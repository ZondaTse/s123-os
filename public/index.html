<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>S123 OS</title>
<link rel="stylesheet" href="/css/app.css?v=6">
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen" class="login-wrap">
  <div class="login-top">
    <div class="login-logo">
      <svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="white" stroke-width="2.5"/><text x="23" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="white">$</text></svg>
    </div>
    <div class="login-title">S123 OS</div>
  </div>
  <div class="login-body">
    <div class="login-tabs">
      <button class="login-tab active" onclick="switchLoginTab('login')">登录</button>
      <button class="login-tab" onclick="switchLoginTab('register')">注册</button>
    </div>
    <div id="login-fields">
      <div class="login-field"><span class="login-field-label">手机号</span><input id="login-phone" type="tel" placeholder="请输入手机号"></div>
      <div class="login-field"><span class="login-field-label">密码</span><input id="login-pwd" type="password" placeholder="请输入密码"></div>
      <button class="login-btn" onclick="doLogin()">登录</button>
    </div>
    <div id="register-fields" style="display:none">
      <div class="login-field"><span class="login-field-label">姓名</span><input id="reg-name" type="text" placeholder="请输入姓名"></div>
      <div class="login-field"><span class="login-field-label">手机号</span><input id="reg-phone" type="tel" placeholder="请输入手机号"></div>
      <div class="login-field"><span class="login-field-label">密码</span><input id="reg-pwd" type="password" placeholder="设置密码"></div>
      <div class="login-field"><span class="login-field-label">邀请码</span><input id="reg-invite" type="text" placeholder="请输入邀请码"></div>
      <div class="login-invite-hint">邀请码由管理员提供</div>
      <button class="login-btn" onclick="doRegister()">注册</button>
    </div>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="app" style="display:none">
  <!-- 状态栏渐变遮罩 -->

  <!-- 日夜切换浮动按钮 -->
  <button id="theme-toggle-btn" onclick="toggleTheme();updateThemeIcon()"><svg id="theme-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg><svg id="theme-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>

  <!-- TAB 1: Chat -->
  <div class="page active" id="page-chat">
    <div class="chat-wrap">
      <div class="chat-messages" id="chat-messages">
        <div class="loading"><div class="spinner"></div>加载消息...</div>
      </div>
      <div class="chat-input-bar" style="position:relative">
        <!-- 加号菜单 -->
        <div class="plus-menu" id="chat-plus-menu">
          <div class="plus-menu-item" onclick="Chat.openPhoto()">
            <div class="plus-menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
            <span>照片</span>
          </div>
          <div class="plus-menu-item" onclick="Chat.showWoTask()">
            <div class="plus-menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
            <span>Wo任务</span>
          </div>
          <div class="plus-menu-item" onclick="Chat.showTaTask()">
            <div class="plus-menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></div>
            <span>Ta任务</span>
          </div>
          <div class="plus-menu-item" onclick="Chat.showProductPicker()">
            <div class="plus-menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
            <span>商品</span>
          </div>
          <div class="plus-menu-item" onclick="Chat.showBookmarkPicker()">
            <div class="plus-menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
            <span>收藏</span>
          </div>
        </div>
        <button id="chat-plus-btn" style="width:40px;height:40px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;border-radius:50%">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
        <input id="img-picker" type="file" accept="image/*" style="display:none">
        <textarea class="chat-input-field" id="chat-input" placeholder="输入消息..." rows="1"></textarea>
        <button class="chat-send-btn" onclick="Chat.sendText()">发送</button>
      </div>
    </div>
    <div class="ctx-overlay" id="ctx-overlay" onclick="this.classList.remove('show');document.getElementById('ctx-menu').classList.remove('show')"></div>
    <div class="ctx-menu" id="ctx-menu">
      <div class="ctx-item" id="ctx-to-task"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>转为任务</div>
      <div class="ctx-item" id="ctx-bookmark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>收藏</div>
      <div class="ctx-item" id="ctx-copy"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</div>
      <div class="ctx-item danger" id="ctx-del"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>删除</div>
    </div>
  </div>

  <!-- TAB 2: Execution -->
  <div class="page" id="page-exec">
    <div class="battlefield" id="battlefield">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- TAB 3: Wealth -->
  <div class="page" id="page-wealth">
    <div class="scroll-list" id="wealth-content">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- TAB 4: My -->
  <div class="page" id="page-my">
    <div class="scroll-list" id="my-content">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-item active" data-tab="chat" onclick="switchTab('chat')">
      <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <span>会话</span>
    </button>
    <button class="tab-item" data-tab="exec" onclick="switchTab('exec')">
      <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
      <span>执行</span>
    </button>
    <button class="tab-item" data-tab="wealth" onclick="switchTab('wealth')">
      <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v1m0 8v1M9.5 9.5C9.5 8.4 10.6 8 12 8s2.5.4 2.5 1.5S13.4 11 12 11s-2.5.6-2.5 1.5S10.6 16 12 16s2.5-.4 2.5-1.5"/></svg></div>
      <span>发财</span>
    </button>
    <button class="tab-item" data-tab="my" onclick="switchTab('my')">
      <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <span>我的</span>
    </button>
  </div>
</div>

<!-- ══ SHEETS ══ -->

<!-- Wo任务 -->
<div class="overlay" id="wo-task-overlay" onclick="if(event.target===this)hideSheet('wo-task-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">Wo任务（给自己）</div>
    <div class="sheet-body">
      <div class="form-group"><label class="form-label">任务标题 *</label><input class="form-input" id="wo-task-title" placeholder="例：整理本周直播数据"></div>
      <div class="form-group"><label class="form-label">关联商品（可选）</label><select class="form-input form-select" id="wo-task-product"></select></div>
      <div class="form-group"><label class="form-label">完成日期</label><input class="form-input" id="wo-task-due" type="date"></div>
      <button class="btn btn-primary btn-block" style="margin-top:4px" onclick="Chat.saveWoTask()">创建任务</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('wo-task-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- Ta任务 -->
<div class="overlay" id="ta-task-overlay" onclick="if(event.target===this)hideSheet('ta-task-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">Ta任务（指派他人）</div>
    <div class="sheet-body">
      <div class="form-group"><label class="form-label">任务标题 *</label><input class="form-input" id="ta-task-title" placeholder="例：重新拍K4226显瘦对比图"></div>
      <div class="form-group">
        <label class="form-label">参与成员（点击取消）</label>
        <div id="ta-task-members" style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 0"></div>
      </div>
      <div class="form-group"><label class="form-label">关联商品（可选）</label><select class="form-input form-select" id="ta-task-product"></select></div>
      <div class="form-group"><label class="form-label">完成日期</label><input class="form-input" id="ta-task-due" type="date"></div>
      <button class="btn btn-primary btn-block" style="margin-top:4px" onclick="Chat.saveTaTask()">指派任务</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('ta-task-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- 商品选择器 -->
<div class="overlay" id="product-picker-overlay" onclick="if(event.target===this)hideSheet('product-picker-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">选择商品</div>
    <div class="sheet-body" style="padding:0"><div id="product-picker-list"></div></div>
  </div>
</div>

<!-- 收藏选择器 -->
<div class="overlay" id="bookmark-picker-overlay" onclick="if(event.target===this)hideSheet('bookmark-picker-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">从收藏发送</div>
    <div class="sheet-body" style="padding:0"><div id="bookmark-picker-list"></div></div>
  </div>
</div>

<!-- 参考视频 -->
<div class="overlay" id="content-overlay" onclick="if(event.target===this)hideSheet('content-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">参考视频</div>
    <div class="sheet-body">
      <input type="hidden" id="content-id">
      <div class="form-group"><label class="form-label">抖音链接</label><input class="form-input" id="content-url" placeholder="https://v.douyin.com/..."></div>
      <div class="form-group"><label class="form-label">备注</label><textarea class="form-input" id="content-note" rows="4" placeholder="为什么参考这个视频？学到了什么？"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="Exec.saveContent()">保存</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('content-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- 任务编辑 -->
<div class="overlay" id="task-edit-overlay" onclick="if(event.target===this)hideSheet('task-edit-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">编辑任务</div>
    <div class="sheet-body">
      <input type="hidden" id="task-edit-id">
      <div class="form-group"><label class="form-label">任务标题</label><input class="form-input" id="task-edit-title"></div>
      <div class="form-group"><label class="form-label">负责人</label><select class="form-input form-select" id="task-edit-assignee"></select></div>
      <div class="form-group"><label class="form-label">状态</label>
        <select class="form-input form-select" id="task-edit-status">
          <option value="todo">待做</option><option value="doing">进行中</option><option value="done">已完成</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" onclick="Exec.saveTaskEdit()">保存</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('task-edit-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- 复盘 -->
<div class="overlay" id="review-overlay" onclick="if(event.target===this)hideSheet('review-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">🎯 任务完成，来复盘一下</div>
    <div class="sheet-body">
      <input type="hidden" id="review-task-id">
      <div class="form-group"><label class="form-label">做了什么 *</label><textarea class="form-input" id="review-did" rows="2" placeholder="一句话就够"></textarea></div>
      <div class="form-group"><label class="form-label">结果怎么样</label><textarea class="form-input" id="review-result" rows="2" placeholder="结果如何"></textarea></div>
      <div class="form-group"><label class="form-label">下次怎么做更好</label><textarea class="form-input" id="review-next" rows="2" placeholder="改进方向"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="Exec.saveReview()">提交复盘 +30 EXP</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('review-overlay')">跳过</button>
    </div>
  </div>
</div>

<!-- 商品新建（只填款号+图片） -->
<div class="overlay" id="product-edit-overlay" onclick="if(event.target===this)hideSheet('product-edit-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title" id="product-sheet-title">新建商品</div>
    <div class="sheet-body">
      <input type="hidden" id="product-edit-id">
      <div class="form-group">
        <label class="form-label">款号 *</label>
        <div style="display:flex;gap:8px">
          <input class="form-input" id="product-edit-sku" placeholder="例：S123-2603K4226" style="flex:1">
          <button onclick="Wealth.syncFromKuaima()" style="background:var(--green);color:white;border:none;border-radius:8px;padding:0 14px;font-size:var(--font-sm);font-weight:600;cursor:pointer;flex-shrink:0">从快麦同步</button>
        </div>
        <div style="font-size:var(--font-xs);color:var(--text3);margin-top:6px" id="kuaima-sync-result">输入款号后点「从快麦同步」自动填入名称、价格、库存</div>
      </div>
      <div class="form-group" id="product-name-group" style="display:none">
        <label class="form-label">商品名称</label>
        <input class="form-input" id="product-edit-name" placeholder="从快麦同步后自动填入">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" id="product-price-group" style="display:none">
        <div class="form-group">
          <label class="form-label">售价</label>
          <input class="form-input" id="product-edit-price" type="text" inputmode="decimal" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">库存</label>
          <input class="form-input" id="product-edit-stock" type="text" inputmode="numeric" placeholder="0">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">状态</label>
        <select class="form-input form-select" id="product-edit-status">
          <option value="new">新品</option><option value="hot">爆款</option>
          <option value="stable">普通</option><option value="sleeping">待清货</option><option value="zombie">停售</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">商品图片（可选，快麦有图会自动同步）</label><input type="file" accept="image/*" id="product-edit-image" style="font-size:15px"></div>
      <button class="btn btn-primary btn-block" onclick="Wealth.saveProduct()">保存</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('product-edit-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- 发财圈发布 -->
<div class="overlay" id="moment-overlay" onclick="if(event.target===this)hideSheet('moment-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">发布到发财圈</div>
    <div class="sheet-body">
      <div class="form-group"><textarea class="publish-textarea form-input" id="moment-content" placeholder="分享团队高光时刻..."></textarea></div>
      <div class="form-group"><label class="form-label">关联商品（可选）</label><select class="form-input form-select" id="moment-product"></select></div>
      <div class="form-group"><label class="form-label">图片（可选）</label><input type="file" accept="image/*" id="moment-image" style="font-size:15px"></div>
      <button class="btn btn-primary btn-block" onclick="Wealth.publishMoment()">发布</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('moment-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- 评论 -->
<div class="overlay" id="comment-overlay" onclick="if(event.target===this)hideSheet('comment-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">发表评论</div>
    <div class="sheet-body">
      <input type="hidden" id="comment-moment-id">
      <div class="form-group"><textarea class="form-input" id="comment-content" rows="3" placeholder="写评论..."></textarea></div>
      <button class="btn btn-primary btn-block" onclick="Wealth.submitComment()">发布</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('comment-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- 头像操作 -->
<div class="overlay" id="avatar-overlay" onclick="if(event.target===this)hideSheet('avatar-overlay')">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-body" style="padding-bottom:8px">
      <div class="menu-row" onclick="My.showPresetAvatars()"><div class="menu-icon" style="background:#e8f5e9"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#07c160" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M3 21a9 9 0 0 1 18 0"/></svg></div><div class="menu-row-label">选择预设头像</div></div>
      <div class="menu-row" onclick="My.pickAvatar('camera')"><div class="menu-icon" style="background:#e3f2fd"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1677ff" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div><div class="menu-row-label">拍照</div></div>
      <div class="menu-row" onclick="My.pickAvatar('album')"><div class="menu-icon" style="background:#f3e5f5"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9c27b0" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div><div class="menu-row-label">从相册选择</div></div>

<script>
function switchLoginTab(t) {
  document.getElementById('login-fields').style.display = t==='login'?'':'none';
  document.getElementById('register-fields').style.display = t==='register'?'':'none';
  document.querySelectorAll('.login-tab').forEach((b,i) => b.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='register')));
}
async function doLogin() {
  const phone = document.getElementById('login-phone').value.trim();
  const password = document.getElementById('login-pwd').value;
  const err = document.getElementById('login-error'); err.textContent = '';
  try { const d = await API.post('/api/auth/login',{phone,password}); localStorage.setItem('s123_token',d.token); State.user=d.user; bootApp(); }
  catch(e) { err.textContent = e.message||'登录失败'; }
}
async function doRegister() {
  const name=document.getElementById('reg-name').value.trim(), phone=document.getElementById('reg-phone').value.trim();
  const password=document.getElementById('reg-pwd').value, invite_code=document.getElementById('reg-invite').value.trim();
  const err=document.getElementById('login-error'); err.textContent='';
  if(!name||!phone||!password||!invite_code){err.textContent='请填写所有字段';return;}
  try { const d=await API.post('/api/auth/register',{name,phone,password,invite_code}); localStorage.setItem('s123_token',d.token); State.user=d.user; bootApp(); }
  catch(e) { err.textContent=e.message||'注册失败'; }
}
function bootApp() {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  updateThemeIcon();
  switchTab('chat');
  Chat.init(); Exec.init(); Wealth.init(); My.init();
}
function switchTab(t) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.getElementById('page-'+t).classList.add('active');
  const titles={chat:'S123旗舰店',exec:'执行',wealth:'发财',my:'我的'};
  
  if(t==='wealth') Wealth.render();
}
function updateThemeIcon() {
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('theme-sun').style.display = isDark?'none':'block';
  document.getElementById('theme-moon').style.display = isDark?'block':'none';
}
(async()=>{
  initTheme(); updateThemeIcon();
  const t=localStorage.getItem('s123_token'); if(!t) return;
  try { const d=await API.get('/api/auth/me'); State.user=d.user; bootApp(); }
  catch { localStorage.removeItem('s123_token'); }
})();

// PWA 键盘弹起修复：仅在 standalone 模式下生效
(function(){
  const isStandalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  if (!isStandalone || !window.visualViewport) return;

  const vv = window.visualViewport;
  let lastH = vv.height;

  function onViewportResize() {
    const h = vv.height;
    // 设置 CSS 变量供布局使用
    document.documentElement.style.setProperty('--vvh', h + 'px');

    // 高度差 > 150px 认为键盘弹起
    const keyboardOpen = (window.screen.height - h) > 150;
    document.body.classList.toggle('keyboard-open', keyboardOpen);

    // 键盘弹起时：把 #app 顶到 visualViewport 当前偏移位置，确保输入框可见
    const app = document.getElementById('app');
    if (app) {
      if (keyboardOpen) {
        app.style.position = 'fixed';
        app.style.top = vv.offsetTop + 'px';
        app.style.left = '0';
        app.style.right = '0';
        app.style.height = h + 'px';
      } else {
        app.style.position = '';
        app.style.top = '';
        app.style.height = '';
      }
    }
    lastH = h;
  }

  vv.addEventListener('resize', onViewportResize);
  vv.addEventListener('scroll', onViewportResize);
})();
</script>
