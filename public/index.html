<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>S123 OS</title>
<link rel="stylesheet" href="/css/app.css?v=4">
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen" class="login-wrap">
  <div class="login-top">
    <div class="login-logo">
      <svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="white" stroke-width="2.5"/><text x="23" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="white">$</text></svg>
    </div>
    <div class="login-title">S123 OS</div>
  </div>
  <div class="login-body">
    <div class="login-tabs">
      <button class="login-tab active" onclick="switchLoginTab('login')">登录</button>
      <button class="login-tab" onclick="switchLoginTab('register')">注册</button>
    </div>
    <div id="login-fields">
      <div class="login-field">
        <span class="login-field-label">手机号</span>
        <input id="login-phone" type="tel" placeholder="请输入手机号" autocomplete="username">
      </div>
      <div class="login-field">
        <span class="login-field-label">密码</span>
        <input id="login-pwd" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="login-btn" onclick="doLogin()">登录</button>
    </div>
    <div id="register-fields" style="display:none">
      <div class="login-field">
        <span class="login-field-label">姓名</span>
        <input id="reg-name" type="text" placeholder="请输入姓名">
      </div>
      <div class="login-field">
        <span class="login-field-label">手机号</span>
        <input id="reg-phone" type="tel" placeholder="请输入手机号">
      </div>
      <div class="login-field">
        <span class="login-field-label">密码</span>
        <input id="reg-pwd" type="password" placeholder="设置密码">
      </div>
      <div class="login-field">
        <span class="login-field-label">邀请码</span>
        <input id="reg-invite" type="text" placeholder="请输入邀请码">
      </div>
      <div class="login-invite-hint">邀请码由管理员提供</div>
      <button class="login-btn" onclick="doRegister()">注册</button>
    </div>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="app" style="display:none">

  <div class="header" id="main-header">
    <div class="header-left" id="header-left"></div>
    <div class="header-title" id="header-title">S123旗舰店</div>
    <div class="header-right" id="header-right">
      <button class="theme-btn" onclick="toggleTheme()" title="切换模式">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </div>

  <!-- TAB 1: Chat -->
  <div class="page active" id="page-chat">
    <div class="chat-wrap">
      <div class="chat-messages" id="chat-messages">
        <div class="loading"><div class="spinner"></div>加载消息...</div>
      </div>
      <div class="chat-input-bar" id="chat-input-bar">
        <!-- 微信风格语音按钮 -->
        <button class="chat-input-btn" id="chat-voice-btn" onclick="Chat.toggleVoice()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0 0 14 0"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
            <line x1="8" y1="22" x2="16" y2="22"/>
          </svg>
        </button>
        <div class="voice-record-hint" id="voice-hint">🔴 录音中，再次点击停止</div>
        <textarea class="chat-input-field" id="chat-input" placeholder="输入消息..." rows="1"></textarea>
        <button class="chat-input-btn" onclick="document.getElementById('chat-extra').classList.toggle('show')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
        <button class="chat-send-btn" onclick="Chat.sendText()">发送</button>
      </div>
      <div class="chat-extra-bar" id="chat-extra">
        <div class="chat-extra-item" onclick="document.getElementById('img-picker').click()">
          <div class="chat-extra-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </div>
          <div class="chat-extra-label">图片</div>
          <input id="img-picker" type="file" accept="image/*" style="display:none" onchange="Chat.sendFile(this.files[0],'image');this.value=''">
        </div>
      </div>
    </div>
    <div class="ctx-overlay" id="ctx-overlay" onclick="this.classList.remove('show');document.getElementById('ctx-menu').classList.remove('show')"></div>
    <div class="ctx-menu" id="ctx-menu">
      <div class="ctx-item" id="ctx-to-task">📋 转为任务</div>
      <div class="ctx-item" id="ctx-to-exp">💡 转为经验</div>
      <div class="ctx-item" id="ctx-copy">📄 复制</div>
      <div class="ctx-item danger" id="ctx-del">🗑 删除</div>
    </div>
  </div>

  <!-- TAB 2: Execution — 作战地图 -->
  <div class="page" id="page-exec">
    <div class="battlefield" id="battlefield">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- TAB 3: Wealth — 发财圈 -->
  <div class="page" id="page-wealth">
    <div class="wealth-subtabs">
      <button class="wealth-subtab active" data-wtab="moments" onclick="Wealth.switchTab('moments')">发财圈</button>
      <button class="wealth-subtab" data-wtab="products" onclick="Wealth.switchTab('products')">商品中心</button>
      <button class="wealth-subtab" data-wtab="gmv" onclick="Wealth.switchTab('gmv')">GMV</button>
    </div>
    <div class="scroll-list" id="wealth-content">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- TAB 4: My -->
  <div class="page" id="page-my">
    <div class="scroll-list" id="my-content">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-item active" data-tab="chat" onclick="switchTab('chat')">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </div>
      <span>会议</span>
    </button>
    <button class="tab-item" data-tab="exec" onclick="switchTab('exec')">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <span>执行</span>
    </button>
    <button class="tab-item" data-tab="wealth" onclick="switchTab('wealth')">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v1m0 8v1M9.5 9.5C9.5 8.4 10.6 8 12 8s2.5.4 2.5 1.5S13.4 11 12 11s-2.5.6-2.5 1.5S10.6 16 12 16s2.5-.4 2.5-1.5"/></svg>
      </div>
      <span>发财</span>
    </button>
    <button class="tab-item" data-tab="my" onclick="switchTab('my')">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <span>我的</span>
    </button>
  </div>
</div>

<!-- ══ SHEETS ══ -->

<!-- Task Sheet — 极简2字段 -->
<div class="overlay" id="task-overlay" onclick="if(event.target===this)hideSheet('task-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="task-sheet-title">新建任务</div>
    <div class="sheet-body">
      <input type="hidden" id="task-id">
      <div class="form-group">
        <label class="form-label">任务标题 *</label>
        <input class="form-input" id="task-title-input" placeholder="例：重新拍K4226显瘦对比图">
      </div>
      <div class="form-group">
        <label class="form-label">负责人</label>
        <select class="form-input form-select" id="task-assignee"></select>
      </div>
      <button class="btn btn-primary btn-block" onclick="Exec.saveTask()">保存</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('task-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- Plan Sheet — 极简1字段 -->
<div class="overlay" id="plan-overlay" onclick="if(event.target===this)hideSheet('plan-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">新建计划</div>
    <div class="sheet-body">
      <input type="hidden" id="plan-id">
      <div class="form-group">
        <label class="form-label">计划标题 *</label>
        <input class="form-input" id="plan-title-input" placeholder="例：4226 拍摄方案">
      </div>
      <div class="form-group">
        <label class="form-label">类型</label>
        <select class="form-input form-select" id="plan-type">
          <option value="shooting">拍摄</option>
          <option value="live">直播</option>
          <option value="product">商品</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" onclick="Exec.savePlan()">保存</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('plan-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- Content Sheet — 极简2字段 -->
<div class="overlay" id="content-overlay" onclick="if(event.target===this)hideSheet('content-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">新建素材研究</div>
    <div class="sheet-body">
      <input type="hidden" id="content-id">
      <div class="form-group">
        <label class="form-label">标题 *</label>
        <input class="form-input" id="content-title-input" placeholder="例：竞品爆款视频分析">
      </div>
      <div class="form-group">
        <label class="form-label">抖音链接</label>
        <input class="form-input" id="content-url" placeholder="https://v.douyin.com/...">
      </div>
      <!-- 隐藏字段保留兼容性 -->
      <input type="hidden" id="content-boom">
      <input type="hidden" id="content-why">
      <input type="hidden" id="content-plan">
      <input type="hidden" id="content-result">
      <input type="hidden" id="content-summary">
      <input type="hidden" id="content-screenshot">
      <div id="content-products" style="display:none"></div>
      <button class="btn btn-primary btn-block" onclick="Exec.saveContent()">保存</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('content-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- Review Sheet — 今日复盘 -->
<div class="overlay" id="review-overlay" onclick="if(event.target===this)hideSheet('review-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">今日复盘</div>
    <div class="sheet-body">
      <div class="form-group">
        <label class="form-label">今天做了什么</label>
        <textarea class="form-input" id="review-did" rows="3" placeholder="今天的主要工作..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">结果如何</label>
        <textarea class="form-input" id="review-result" rows="2" placeholder="完成情况..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">下次优化</label>
        <textarea class="form-input" id="review-next" rows="2" placeholder="改进方向..."></textarea>
      </div>
      <button class="btn btn-primary btn-block" onclick="Exec.saveReview()">提交复盘 +30 EXP</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('review-overlay')">取消</button>
    </div>
  </div>
</div>

<!-- Product Sheet -->
<div class="overlay" id="product-edit-overlay" onclick="if(event.target===this)hideSheet('product-edit-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="product-sheet-title">新建商品</div>
    <div class="sheet-body">
      <input type="hidden" id="product-edit-id">
      <div class="form-group">
        <label class="form-label">款号 *</label>
        <input class="form-input" id="product-edit-sku" placeholder="例：S123-2603">
      </div>
      <div class="form-group">
        <label class="form-label">商品名称 *</label>
        <input class="form-input" id="product-edit-name" placeholder="例：2603莫代尔短裤">
      </div>
      <div class="form-group">
        <label class="form-label">售价</label>
        <input class="form-input" id="product-edit-price" type="number" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">成本</label>
        <input class="form-input" id="product-edit-cost" type="number" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">库存</label>
        <input class="form-input" id="product-edit-stock" type="number" placeholder="0">
      </div>

        <label class="form-label">状态</label>
        <select class="form-input form-select" id="product-edit-status">
          <option value="new">新品</option>
          <option value="hot">爆款</option>
          <option value="stable">稳定款</option>
          <option value="sleeping">睡眠款</option>
          <option value="zombie">僵尸款</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">商品图片</label>
        <input type="file" accept="image/*" id="product-edit-image" style="font-size:15px">
      </div>
      <button class="btn btn-primary btn-block" onclick="Wealth.saveProduct()">保存</button>
      <button class="btn btn-secondary btn-block mt-8" onclick="hideSheet('product-edit-overlay')">取消</button>

  </div>
</div>

<!-- Publish Moment Sheet -->
<div class="overlay" id="moment-overlay" onclick="if(event.target===this)hideSheet('moment-overlay')">

    <div class="sheet-title">发布到发财圈</div>

<!-- Change Password Sheet -->

<script src="/js/utils.js?v=4"></script>
<script src="/js/chat.js?v=4"></script>
<script src="/js/exec.js?v=4"></script>
<script src="/js/wealth.js?v=4"></script>
<script>
// ── App Bootstrap ──
function switchLoginTab(t) {
  document.getElementById('login-fields').style.display = t==='login'?'':'none';
  document.getElementById('register-fields').style.display = t==='register'?'':'none';
  document.querySelectorAll('.login-tab').forEach((b,i) => b.classList.toggle('active', (i===0&&t==='login')||(i===1&&t==='register')));
}

async function doLogin() {
  const phone = document.getElementById('login-phone').value.trim();
  const password = document.getElementById('login-pwd').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const d = await API.post('/api/auth/login', { phone, password });
    localStorage.setItem('s123_token', d.token);
    State.user = d.user;
    bootApp();
  } catch(e) { err.textContent = e.message || '登录失败'; }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-pwd').value;
  const invite_code = document.getElementById('reg-invite').value.trim();
  const err = document.getElementById('login-error');
  err.textContent = '';
  if (!name||!phone||!password||!invite_code) { err.textContent = '请填写所有字段'; return; }
  try {
    const d = await API.post('/api/auth/register', { name, phone, password, invite_code });
    localStorage.setItem('s123_token', d.token);
    State.user = d.user;
    bootApp();
  } catch(e) { err.textContent = e.message || '注册失败'; }
}

function bootApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  updateThemeIcon();
  switchTab('chat');
  Chat.init();
  Exec.init();
  Wealth.init();
  My.init();
}

function switchTab(t) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(b => b.classList.toggle('active', b.dataset.tab===t));
  document.getElementById('page-'+t).classList.add('active');
  const titles = { chat:'S123旗舰店', exec:'作战地图', wealth:'发财', my:'我的' };
  document.getElementById('header-title').textContent = titles[t] || 'S123 OS';
  // header right: 发财圈show publish btn
  const hr = document.getElementById('header-right');
  if (t === 'wealth') {
    hr.innerHTML = `<button class="theme-btn" onclick="toggleTheme()"><span id="theme-icon2">☀️</span></button>
      <button class="theme-btn" id="publish-btn" onclick="Wealth.showPublish()" style="font-size:22px">📝</button>`;
    updateThemeIcon();
  } else {
    hr.innerHTML = `<button class="theme-btn" onclick="toggleTheme()"><span id="theme-icon">☀️</span></button>`;
    updateThemeIcon();
  }
}

function updateThemeIcon() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  ['theme-icon','theme-icon2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = isDark ? '🌙' : '☀️';
  });
}

const _toggleTheme = toggleTheme;
toggleTheme = function() {
  _toggleTheme();
  updateThemeIcon();
};

// ── Auto login ──
(async () => {
  initTheme();
  updateThemeIcon();
  const t = localStorage.getItem('s123_token');
  if (!t) return;
  try {
    const d = await API.get('/api/auth/me');
    State.user = d.user;
    bootApp();
  } catch { localStorage.removeItem('s123_token'); }
})();
</script>
